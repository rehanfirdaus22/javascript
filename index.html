<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Sepatu Ala Rehan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Toko Sepatu ala Rehan</h1>
    <p>Toko ini menyediakan sepatu limited edition selama 7 hari.</p>
  </header>

  <main>
    <div class="toolbar">
      <input type="text" id="searchInput" placeholder="Cari nama produk...">
      <button type="button" class="secondary" id="toggleHabisBtn">Sembunyikan produk habis</button>
    </div>

    <div class="grid" id="produkGrid"></div>

    <form class="form-tambah" id="formTambah" novalidate>
      <h2>Tambah Produk Baru</h2>
      <div class="form-row">
        <div class="field">
          <label for="inputNama">Nama produk</label>
          <input type="text" id="inputNama">
          <div class="error-text" id="errorNama"></div>
        </div>
        <div class="field">
          <label for="inputKategori">Kategori</label>
          <input type="text" id="inputKategori">
          <div class="error-text" id="errorKategori"></div>
        </div>
        <div class="field">
          <label for="inputHarga">Harga (Rp)</label>
          <input type="number" id="inputHarga">
          <div class="error-text" id="errorHarga"></div>
        </div>
        <div class="field">
          <label for="inputStok">Stok</label>
          <input type="number" id="inputStok">
          <div class="error-text" id="errorStok"></div>
        </div>
      </div>
      <button type="submit">Tambah Produk</button>
    </form>
  </main>

  <footer>
    Buruan checkout sebelum menyesal, barang limited punah menyesal kemudian!
  </footer>

  <script src="script.js"></script>
</body>
</html>
